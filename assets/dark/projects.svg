<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 564" width="900" height="564"><style>text{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="900" height="564" fill="#0d1117"/><text x="44" y="46" font-size="40" font-weight="700" fill="#30363d" xml:space="preserve" >03</text><text x="108" y="38" font-size="15" font-weight="700" fill="#8b949e" xml:space="preserve" >P R O J E C T S</text><text x="856" y="38" font-size="13" font-weight="400" fill="#8b949e" xml:space="preserve" text-anchor="end">~/03-projects</text><rect x="44" y="74" width="812" height="1" fill="#30363d"/><text x="44" y="104" font-size="14" font-weight="700" fill="#8b949e" xml:space="preserve" >01</text><text x="84" y="104" font-size="16" font-weight="700" fill="#e6edf3" xml:space="preserve" letter-spacing="1">TROPA</text><rect x="806" y="89" width="50" height="22" rx="3" fill="none" stroke="#d4a94a"/><text x="831.0" y="105" font-size="11" font-weight="700" fill="#d4a94a" xml:space="preserve" text-anchor="middle">LIVE</text><text x="84" y="130" font-size="13.5" font-weight="400" fill="#8b949e" xml:space="preserve" >Map of places around Almaty for going out with friends; real users.</text><text x="84" y="150" font-size="13.5" font-weight="400" fill="#8b949e" xml:space="preserve" >SSE chats, Telegram notifications, rate-limited auth, moderation.</text><text x="84" y="174" font-size="12.5" font-weight="400" fill="#d4a94a" xml:space="preserve" >&gt; go · postgresql · pgx · docker · caddy</text><rect x="44" y="194" width="812" height="1" fill="#30363d"/><text x="44" y="224" font-size="14" font-weight="700" fill="#8b949e" xml:space="preserve" >02</text><text x="84" y="224" font-size="16" font-weight="700" fill="#e6edf3" xml:space="preserve" letter-spacing="1">IELTS WRITING SCORER</text><rect x="822" y="209" width="34" height="22" rx="3" fill="none" stroke="#d4a94a"/><text x="839.0" y="225" font-size="11" font-weight="700" fill="#d4a94a" xml:space="preserve" text-anchor="middle">ML</text><text x="84" y="250" font-size="13.5" font-weight="400" fill="#8b949e" xml:space="preserve" >Fine-tuned DeBERTa-v3 scores essays on 4 criteria; an ONNX service</text><text x="84" y="270" font-size="13.5" font-weight="400" fill="#8b949e" xml:space="preserve" >called from Go. The LLM only explains the scores, it never grades.</text><text x="84" y="294" font-size="12.5" font-weight="400" fill="#d4a94a" xml:space="preserve" >&gt; python · pytorch · onnx runtime · go</text><rect x="44" y="314" width="812" height="1" fill="#30363d"/><text x="44" y="344" font-size="14" font-weight="700" fill="#8b949e" xml:space="preserve" >03</text><text x="84" y="344" font-size="16" font-weight="700" fill="#e6edf3" xml:space="preserve" letter-spacing="1">F1 RACE WINNER PREDICTION</text><rect x="822" y="329" width="34" height="22" rx="3" fill="none" stroke="#d4a94a"/><text x="839.0" y="345" font-size="11" font-weight="700" fill="#d4a94a" xml:space="preserve" text-anchor="middle">ML</text><text x="84" y="370" font-size="13.5" font-weight="400" fill="#8b949e" xml:space="preserve" >Historical Formula 1 data: preprocessing, XGBoost, a custom</text><text x="84" y="390" font-size="13.5" font-weight="400" fill="#8b949e" xml:space="preserve" >race-level winner accuracy, feature importance, learning curve.</text><text x="84" y="414" font-size="12.5" font-weight="400" fill="#d4a94a" xml:space="preserve" >&gt; python · xgboost · pandas</text><rect x="44" y="434" width="812" height="1" fill="#30363d"/><text x="44" y="464" font-size="14" font-weight="700" fill="#8b949e" xml:space="preserve" >04</text><text x="84" y="464" font-size="16" font-weight="700" fill="#e6edf3" xml:space="preserve" letter-spacing="1">DECENTRATHON 6.0</text><rect x="766" y="449" width="90" height="22" rx="3" fill="none" stroke="#d4a94a"/><text x="811.0" y="465" font-size="11" font-weight="700" fill="#d4a94a" xml:space="preserve" text-anchor="middle">HACKATHON</text><text x="84" y="490" font-size="13.5" font-weight="400" fill="#8b949e" xml:space="preserve" >Team captain, ~1,500 participants. A support copilot for a mobile</text><text x="84" y="510" font-size="13.5" font-weight="400" fill="#8b949e" xml:space="preserve" >operator: ticket category and priority, grounded answers.</text><text x="84" y="534" font-size="12.5" font-weight="400" fill="#d4a94a" xml:space="preserve" >&gt; python · llm · classification</text></svg>
