<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="274" viewBox="0 0 1000 274"><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}.d{font-family:'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}@keyframes b{50%{opacity:0}}.cur{animation:b 1.1s steps(1) infinite}@media (prefers-reduced-motion:reduce){.cur{animation:none}}</style><text x="40" y="56" class="m" font-size="13" font-weight="400" fill="#8c8c8c" >02</text><text x="78" y="56" class="d" font-size="34" font-weight="900" fill="#f2f2f2" letter-spacing="-1">EXPERIENCE</text><line x1="40" y1="78" x2="960" y2="78" stroke="#2b2b2b"/><text x="40" y="124" class="d" font-size="22" font-weight="900" fill="#f2f2f2" >QAZCODE / BEELINE KAZAKHSTAN</text><text x="960" y="124" class="m" font-size="13" font-weight="400" fill="#8c8c8c" text-anchor="end">Go Developer (intern)</text><text x="40" y="160" font-size="15" font-weight="400" fill="#8c8c8c" >—</text><text x="64" y="160" font-size="15" font-weight="400" fill="#f2f2f2" >Fixed 3 critical CVEs: pgx v4 → v5 migration, Fiber and x/crypto upgrades.</text><text x="40" y="186" font-size="15" font-weight="400" fill="#8c8c8c" >—</text><text x="64" y="186" font-size="15" font-weight="400" fill="#f2f2f2" >Hardened ~19 microservices after Fortify: non-root containers, path traversal.</text><text x="40" y="212" font-size="15" font-weight="400" fill="#8c8c8c" >—</text><text x="64" y="212" font-size="15" font-weight="400" fill="#f2f2f2" >Scrubbed credentials from Git history; fixed PostgreSQL / MSSQL TLS issues.</text><text x="40" y="238" font-size="15" font-weight="400" fill="#8c8c8c" >—</text><text x="64" y="238" font-size="15" font-weight="400" fill="#f2f2f2" >Found the root cause of a production race condition during an incident.</text></svg>
